name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency doctor
        run: npm run doctor

      - name: Build minimal single-file example
        run: npm run build:example

      - name: Upload example HTML
        uses: actions/upload-artifact@v4
        with:
          name: minimal-standalone
          path: examples/minimal/slides-standalone.html
